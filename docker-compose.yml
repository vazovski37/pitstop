# Local development stack. Azure is only reached through GitHub Actions.
#   npm run db:up            -> Postgres with pgvector only (run the server with `npm run dev:server`)
#   docker compose up --build -> Postgres + the server image, same as production
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: pitstop
      POSTGRES_PASSWORD: pitstop
      POSTGRES_DB: pitstop
    ports:
      - "${PITSTOP_DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pitstop -d pitstop"]
      interval: 2s
      timeout: 3s
      retries: 20

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
      args:
        GIT_SHA: local
    environment:
      DATABASE_URL: postgresql://pitstop:pitstop@db:5432/pitstop
      PORT: "8080"
      # The rest comes from .env next to this file (for developing Pitstop itself); empty means off/open.
      PITSTOP_TOKEN: ${PITSTOP_TOKEN:-}
      PITSTOP_REPAIR: ${PITSTOP_REPAIR:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-}
      PITSTOP_VALIDATE: ${PITSTOP_VALIDATE:-}
      PITSTOP_CHECK: ${PITSTOP_CHECK:-}
      MIRROR_GITHUB_TOKEN: ${MIRROR_GITHUB_TOKEN:-}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
